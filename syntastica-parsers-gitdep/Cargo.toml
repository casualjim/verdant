#! ### Language families
#! Each of these features enables a family of related languages.

## Include parsers for the languages of this family: asm, asm68k, disassembly, hexdump, ld, nasm,
## objdump, pioasm, smali, tal, wat.
assembly = [
    "asm",
]

## Include parsers for the languages of this family: eelixir, elixir, erlang, gleam, heex, sface.
beam = [
    "elixir",
    "dep:tree-sitter-gleam",
]

## Include parsers for the languages of this family: bitbake, bp, bzl, cmake, earthfile, gn, just,
## make, meson, ninja, snakemake.
build-systems = [
    "cmake",
    "make",
]

## Include parsers for the languages of this family: arduino, c, cpp, cuda, doxygen, ispc, llvm,
## mlir, nqc, objc, re2c, tablegen.
c-family = [
    "c",
    "cpp",
]

## Include parsers for the languages of this family: cue, dhall, hcl, terraform, jsonnet, kcl,
## nickel, pkl.
config-languages = [
    "hcl",
]

## Include parsers for the languages of this family: corn, cpon, editorconfig, hjson, hocon, ini,
## jproperties, json, json5, jsonc, kdl, scfg, toml, yaml, ziggy, ziggy_schema.
data-formats = [
    "ini",
    "json",
    "json5",
    "jsonc",
    "toml",
    "yaml",
]

## Include parsers for the languages of this family: enforce, gdresource, gdscript, gdshaderinc,
## poefilter, runescript, sourcepawn, squirrel.
game-scripting = []

## Include parsers for the languages of this family: go, goctl, gomod, gosum, gotmpl, helm, gowork,
## templ.
go-family = [
    "go",
]

## Include parsers for the languages of this family: groovy, java, javadoc, kotlin, scala.
jvm-family = [
    "java",
    "kotlin",
    "scala",
]

## Include parsers for the languages of this family: desktop, dts, gpg, hyprlang, kconfig, kitty,
## muttrc, passwd, rasi, readline, rifleconf, sshconfig, sxhkdrc, tmux, udevrules, xcompose,
## xdefaults, yuck, zathurarc.
linux-config = [
    "sshconfig",
]

## Include parsers for the languages of this family: bass, clojure, elisp, fennel, janet, lisp,
## racket, scheme.
lisps = [
    "clojure",
]

## Include parsers for the languages of this family: lua, luadoc, luap, luau, teal.
lua-family = [
    "lua",
    "luap",
]

## Include parsers for the languages of this family: bib, bibtex, djot, help, markdown,
## markdown_inline, pod, rst, typst.
markup = [
    "markdown",
    "typst",
]

## Include parsers for the languages of this family: blade, php, php_only, phpdoc, twig, typoscript.
php-family = [
    "php",
]

## Include parsers for the languages of this family: htmldjango, jinja, jinja_inline, pymanifest,
## python, requirements.
python-family = [
    "python",
]

## Include parsers for the languages of this family: groq, jq, kusto, promql, prql, ql, sparql, sql,
## turtle.
query-languages = [
    "dep:tree-sitter-ql",
    "sql",
]

## Include parsers for the languages of this family: ejs, erb, eruby, rbs, ruby, slim.
ruby-family = [
    "dep:tree-sitter-embedded-template",
    "ruby",
]

## Include parsers for the languages of this family: lalrpop, ron, rush, rust, tera, ungrammar.
rust-family = [
    "dep:tree-sitter-LALRPOP",
    "dep:tree-sitter-rush",
    "rust",
]

## Include parsers for the languages of this family: capnp, fidl, fsd, graphql, idl, pbtxt, proto,
## smithy, sproto, thrift, typespec, wit.
schemas = [
    "graphql",
    "proto",
]

## Include parsers for the languages of this family: glsl, hlsl, shaderslang, wgsl, wgsl_bevy.
shaders = []

## Include parsers for the languages of this family: awk, bash, elvish, fish, nu, ps1, zsh.
shell = [
    "bash",
    "fish",
    "ps1",
    "zsh",
]

## Include parsers for the languages of this family: bpftrace, strace, systemtap, trace32.
tracing = []

## Include parsers for the languages of this family: blueprint, qml, qmldir, slint.
ui-dsl = []

## Include parsers for the languages of this family: astro, glimmer_javascript, glimmer_typescript,
## handlebars, htmlangular, styled, superhtml, svelte, vue, wxml.
web-frameworks = []

## Include parsers for the languages of this family: cairo, circom, clarity, func, leo, ralph,
## solidity, sway, tact.
web3 = []

