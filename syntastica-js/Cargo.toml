[package]
name = "verdant-js"
version.workspace = true
authors.workspace = true
documentation = "https://docs.rs/verdant-syntax"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Use verdant from JavaScript"

[package.metadata.release]
release = false

[dependencies]
verdant-syntax = { workspace = true, features = ["serde"] }
verdant-macros = { workspace = true, features = ["js"] }
verdant-themes.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.140"
